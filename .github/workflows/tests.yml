name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The committed bundle is what Tampermonkey loads, so it must match src/.
      - name: Check the bundle is up to date with src/
        run: npm run build:check

      - name: Check the userscript parses
        run: node --check dist/RA_Toolkit.user.js

      - name: Run the test suite
        run: npm test
